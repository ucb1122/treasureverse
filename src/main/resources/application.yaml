spring:
  application:
    name: treasureverse

storage:
  provider: minio
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:treasureverse}
    public-url: ${MINIO_PUBLIC_URL:http://localhost:9000/treasureverse}
